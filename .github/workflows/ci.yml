name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ROCQ_VERSION: 9.2.0
  ROCQ_STDLIB_VERSION: 9.2.0

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            rocq-released: https://rocq-prover.org/opam/released

      - name: Install Rocq
        run: opam install -y rocq-core.${ROCQ_VERSION} rocq-stdlib.${ROCQ_STDLIB_VERSION}

      # StringTemplate 4 renders audit/LEDGER.md and README.md.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: opam exec -- make -j2

      # Kernel-checks every ledger entry (QEX entries against
      # Counterexample, repairs and QED names by Check), applies the
      # axiom allowlist / tier policy, writes audit/ledger.tsv and renders
      # the Markdown views from it.
      - name: Audit ledger
        run: opam exec -- make audit

      # audit/Ledger.v, audit/ledger.tsv, audit/LEDGER.md and README.md
      # are generated and committed: any difference means they were not
      # regenerated with `make audit`.
      - name: Golden diff
        run: |
          git status --porcelain -- audit README.md
          git diff --exit-code -- audit README.md
          test -z "$(git status --porcelain -- audit README.md)"

      - name: Counts ratchet
        if: github.event_name == 'pull_request'
        run: |
          if git show "origin/${{ github.base_ref }}:audit/ledger.tsv" > "$RUNNER_TEMP/base-ledger.tsv" 2>/dev/null; then
            python3 audit/ledger.py ratchet "$RUNNER_TEMP/base-ledger.tsv"
          else
            echo "No audit/ledger.tsv on ${{ github.base_ref }}; ratchet baseline starts with this PR."
          fi

      - name: Audit gate self-test
        run: opam exec -- make test-ledger
